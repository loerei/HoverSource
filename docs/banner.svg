<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">HoverSource wordmark banner on dark background</title>
  <desc id="desc">Horizontal HoverSource wordmark banner using the original logo on a dark rounded background.</desc>

  <defs>
    <!-- Background gradient -->
    <linearGradient id="lockupBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151a" />
      <stop offset="100%" stop-color="#090a0d" />
    </linearGradient>

    <!-- Blue/purple gradient for text -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" /> <!-- brand-blue -->
      <stop offset="100%" stop-color="#a855f7" /> <!-- brand-purple -->
    </linearGradient>

    <!-- Underline sweep gradient -->
    <linearGradient id="sweepLineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.88" />
    </linearGradient>

    <clipPath id="roundedClip">
      <rect width="512" height="512" rx="100" />
    </clipPath>

    <filter id="softTextShadow" x="-5%" y="-15%" width="110%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main rounded banner container -->
  <rect x="8" y="8" width="1264" height="304" rx="64" fill="url(#lockupBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient glowing decorative stars -->
  <path d="M 940 38 Q 940 72 974 72 Q 940 72 940 106 Q 940 72 906 72 Q 940 72 940 38 Z" fill="url(#brandGradient)" opacity="0.12" />
  <path d="M 1120 186 Q 1120 206 1140 206 Q 1120 206 1120 226 Q 1120 206 1100 206 Q 1120 206 1120 186 Z" fill="url(#brandGradient)" opacity="0.10" />

  <!-- Left: Original App Logo (embedded via Base64) -->
  <g transform="translate(56 40) scale(0.46875)">
    <image href="data:image/png;base64," x="0" y="0" width="512" height="512" clip-path="url(#roundedClip)" />
  </g>

  <!-- Right: Wordmark Text and Slogan -->
  <g filter="url(#softTextShadow)">
    <text x="340" y="162"
          font-family="Geist, Inter, Segoe UI, sans-serif"
          font-size="96"
          font-weight="800"
          letter-spacing="-3">
      <tspan fill="#ffffff">Hover</tspan><tspan fill="url(#brandGradient)">Source</tspan>
    </text>

    <!-- Sweeping accent line under title -->
    <path d="M 346 194 L 880 194" stroke="url(#sweepLineGradient)" stroke-width="8" stroke-linecap="round"/>

    <!-- Dynamic Slogan -->
    <text x="346" y="238"
          font-family="Geist, Inter, Segoe UI, sans-serif"
          font-size="21"
          font-weight="700"
          letter-spacing="4.8"
          fill="#a1a1aa">TRANSLATE WHAT YOU SEE TO WHAT YOUR AGENT NEEDS</text>
  </g>
</svg>